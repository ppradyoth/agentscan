[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-scan"
version = "1.0.0"
description = "Security scanner for AI-agent configs: MCP servers, CLAUDE.md, settings, hooks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pradyoth P." }]
keywords = ["ai-security", "mcp", "prompt-injection", "llm", "claude", "agents", "sast"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ppradyoth/agentscan"
Issues = "https://github.com/ppradyoth/agentscan/issues"
PyPI = "https://pypi.org/project/ai-agent-scan/"

[project.scripts]
agentscan = "agentscan.cli:main"

[tool.setuptools]
packages = ["agentscan"]
